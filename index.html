<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動体検知システム</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 760px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        /* フルスクリーン（拡大時）のスタイル */
        .container:fullscreen {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            justify-content: center;
            background: #000;
        }
        /* 拡大時は下部のコントロールエリアを非表示 */
        .container:fullscreen .controls {
            display: none !important;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
        }
        .container:fullscreen .video-wrapper {
            height: 100vh;
            aspect-ratio: auto;
        }
        video {
            display: none;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* RECボタン（画面左上配置） */
        .rec-btn-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(255, 68, 68, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            display: none; /* カメラ起動前は非表示 */
            align-items: center;
            gap: 6px;
        }
        .rec-btn-overlay:hover {
            background: rgba(204, 0, 0, 0.95);
        }
        .rec-btn-overlay.recording {
            background: #ff0000;
            animation: pulse-rec 1s infinite;
        }
        @keyframes pulse-rec {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* 全画面切り替えボタン（画面右下配置） */
        .fullscreen-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .fullscreen-btn:hover {
            background: rgba(0, 0, 0, 0.85);
            border-color: #00ffcc;
            color: #00ffcc;
        }

        /* 通常時のコントロールエリア */
        .controls {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background-color: #1e1e1e;
            border-top: 1px solid #2a2a2a;
            flex-wrap: wrap;
        }
        .sound-setting {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        select, input[type="file"] {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }
        select:hover {
            border-color: #00ffcc;
        }
        .file-upload-wrapper {
            display: none;
            align-items: center;
            gap: 6px;
        }
        .file-upload-wrapper.active {
            display: inline-flex;
        }
        button.action-btn {
            background-color: #00ffcc;
            color: #121212;
            font-weight: bold;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.action-btn:hover {
            background-color: #00e6b8;
        }
        button.delete-btn {
            background-color: #444;
            color: #ff6666;
            border: 1px solid #666;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            display: none;
        }
        button.delete-btn:hover {
            background-color: #555;
            color: #ff3333;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: #333;
            color: #aaa;
        }
        .status-badge.active {
            background-color: #00cc88;
            color: #fff;
        }
        .saved-file-info {
            font-size: 0.75rem;
            color: #00ffcc;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="video-wrapper">
            <video id="webcam" playsinline autoplay muted></video>
            <canvas id="outputCanvas"></canvas>
            <canvas id="processingCanvas" style="display:none;"></canvas>
            
            <!-- 左上 RECボタン -->
            <button id="recBtnOverlay" class="rec-btn-overlay">
                <span>●</span> <span id="recBtnText">REC 録画開始</span>
            </button>

            <!-- 右下 広げる/元に戻すボタン -->
            <button id="fullscreenBtn" class="fullscreen-btn">
                <span id="fullscreenIcon">⛶</span>
                <span id="fullscreenText">広げる</span>
            </button>
        </div>

        <div class="controls">
            <button id="startBtn" class="action-btn">カメラ起動</button>
            
            <div class="sound-setting">
                <label for="soundSelect" style="font-size:0.85rem; color:#ccc;">効果音:</label>
                <select id="soundSelect">
                    <option value="beep">ピッ (基本音)</option>
                    <option value="pipipi">ピピピッ (通知)</option>
                    <option value="alarm">警報 (サイレン)</option>
                    <option value="custom">カスタム (保存音源)</option>
                </select>

                <div id="fileWrapper" class="file-upload-wrapper">
                    <input type="file" id="audioFile" accept="audio/*">
                    <span id="savedFileName" class="saved-file-info"></span>
                    <button id="deleteSoundBtn" class="delete-btn">削除</button>
                </div>
            </div>

            <span id="status" class="status-badge">停止中</span>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const video = document.getElementById('webcam');
        const outputCanvas = document.getElementById('outputCanvas');
        const outputCtx = outputCanvas.getContext('2d');
        const processingCanvas = document.getElementById('processingCanvas');
        const processingCtx = processingCanvas.getContext('2d', { willReadFrequently: true });
        
        const startBtn = document.getElementById('startBtn');
        const recBtnOverlay = document.getElementById('recBtnOverlay');
        const recBtnText = document.getElementById('recBtnText');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenText = document.getElementById('fullscreenText');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const statusBadge = document.getElementById('status');

        const soundSelect = document.getElementById('soundSelect');
        const fileWrapper = document.getElementById('fileWrapper');
        const audioFileInput = document.getElementById('audioFile');
        const savedFileName = document.getElementById('savedFileName');
        const deleteSoundBtn = document.getElementById('deleteSoundBtn');

        let isRunning = false;
        let prevFrame = null;
        let audioCtx = null;
        let audioDestination = null;
        let lastSoundTime = 0;
        let customAudioBuffer = null;
        const SOUND_COOLDOWN = 300;

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        const threshold = 30;
        const sampleWidth = 160;
        const sampleHeight = 120;

        processingCanvas.width = sampleWidth;
        processingCanvas.height = sampleHeight;

        // --- IndexedDB ---
        const DB_NAME = 'MotionDetectorSoundDB';
        const STORE_NAME = 'sounds';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e);
            });
        }

        async function saveSoundToDB(arrayBuffer, fileName) {
            const db = await openDB();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.put({ buffer: arrayBuffer, name: fileName }, 'customSound');
        }

        async function deleteSoundFromDB() {
            const db = await openDB();
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.delete('customSound');
        }

        async function loadSoundFromDB() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get('customSound');
                req.onsuccess = async () => {
                    if (req.result) {
                        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const decodedData = await audioCtx.decodeAudioData(req.result.buffer.slice(0));
                        customAudioBuffer = decodedData;
                        savedFileName.textContent = req.result.name;
                        deleteSoundBtn.style.display = 'inline-block';
                    }
                };
            } catch (err) {
                console.warn('保存された音源のロードに失敗:', err);
            }
        }

        loadSoundFromDB();

        soundSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                fileWrapper.classList.add('active');
            } else {
                fileWrapper.classList.remove('active');
            }
        });

        audioFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const arrayBuffer = await file.arrayBuffer();
            await saveSoundToDB(arrayBuffer, file.name);
            savedFileName.textContent = file.name;
            deleteSoundBtn.style.display = 'inline-block';

            audioCtx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
                customAudioBuffer = buffer;
            });
        });

        deleteSoundBtn.addEventListener('click', async () => {
            await deleteSoundFromDB();
            customAudioBuffer = null;
            savedFileName.textContent = '';
            audioFileInput.value = '';
            deleteSoundBtn.style.display = 'none';
            alert('カスタム音源を削除しました。');
        });

        function connectToDestinations(node) {
            node.connect(audioCtx.destination);
            if (audioDestination) {
                node.connect(audioDestination);
            }
        }

        function playSound() {
            const now = Date.now();
            if (now - lastSoundTime < SOUND_COOLDOWN) return;
            lastSoundTime = now;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const mode = soundSelect.value;

            if (mode === 'beep') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.5, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                connectToDestinations(gain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } 
            else if (mode === 'pipipi') {
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = audioCtx.currentTime + (i * 0.07);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, startTime);
                    gain.gain.setValueAtTime(0.12, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.05);
                    osc.connect(gain);
                    connectToDestinations(gain);
                    osc.start(startTime);
                    osc.stop(startTime + 0.05);
                }
            } 
            else if (mode === 'alarm') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                connectToDestinations(gain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } 
            else if (mode === 'custom' && customAudioBuffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = customAudioBuffer;
                connectToDestinations(source);
                source.start(0);
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
                    audio: true
                });
                
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => resolve();
                });

                outputCanvas.width = video.videoWidth;
                outputCanvas.height = video.videoHeight;

                isRunning = true;
                statusBadge.textContent = '監視中';
                statusBadge.classList.add('active');
                startBtn.style.display = 'none';
                recBtnOverlay.style.display = 'inline-flex';

                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioDestination = audioCtx.createMediaStreamDestination();

                const micSource = audioCtx.createMediaStreamSource(stream);
                micSource.connect(audioDestination);

                requestAnimationFrame(processFrame);
            } catch (err) {
                alert('カメラまたはマイクへのアクセスが拒否されました。');
                console.error(err);
            }
        }

        function getFormattedDateTime() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mi = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            return `${yyyy}${mm}${dd}_${hh}${mi}${ss}`;
        }

        function getDisplayText() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mi = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            return `${yyyy}/${mm}/${dd} ${hh}:${mi}:${ss}`;
        }

        function toggleRecording() {
            if (!isRecording) {
                const canvasStream = outputCanvas.captureStream(30);
                const combinedStream = new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...audioDestination.stream.getAudioTracks()
                ]);

                recordedChunks = [];
                mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                const startTimestamp = getFormattedDateTime();

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `motion-${startTimestamp}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                };

                mediaRecorder.start();
                isRecording = true;
                recBtnText.textContent = '■ 録画停止';
                recBtnOverlay.classList.add('recording');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recBtnText.textContent = 'REC 録画開始';
                recBtnOverlay.classList.remove('recording');
            }
        }

        function processFrame() {
            if (!isRunning) return;

            outputCtx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);

            processingCtx.drawImage(video, 0, 0, sampleWidth, sampleHeight);
            const currentFrame = processingCtx.getImageData(0, 0, sampleWidth, sampleHeight);

            if (prevFrame) {
                let minX = sampleWidth;
                let minY = sampleHeight;
                let maxX = 0;
                let maxY = 0;
                let detectedPixels = 0;

                const data1 = prevFrame.data;
                const data2 = currentFrame.data;

                for (let i = 0; i < data1.length; i += 4) {
                    const diff = (Math.abs(data1[i] - data2[i]) + 
                                  Math.abs(data1[i+1] - data2[i+1]) + 
                                  Math.abs(data1[i+2] - data2[i+2])) / 3;

                    if (diff > threshold) {
                        const pixelIndex = i / 4;
                        const x = pixelIndex % sampleWidth;
                        const y = Math.floor(pixelIndex / sampleWidth);

                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;

                        detectedPixels++;
                    }
                }

                if (detectedPixels > 25) {
                    const scaleX = outputCanvas.width / sampleWidth;
                    const scaleY = outputCanvas.height / sampleHeight;

                    const rectX = minX * scaleX;
                    const rectY = minY * scaleY;
                    const rectWidth = (maxX - minX) * scaleX;
                    const rectHeight = (maxY - minY) * scaleY;

                    outputCtx.strokeStyle = '#00ffcc';
                    outputCtx.lineWidth = 4;
                    outputCtx.strokeRect(rectX, rectY, rectWidth, rectHeight);

                    playSound();
                }
            }

            // --- 時間表示（小さめの文字サイズ & 常に画面左下固定） ---
            const timestampText = getDisplayText();
            outputCtx.font = 'bold 14px monospace'; // フォントを小さく設定
            
            const paddingX = 8;
            const paddingY = 6;
            const textWidth = outputCtx.measureText(timestampText).width;
            const textHeight = 14;
            
            const rectX = 10;
            const rectY = outputCanvas.height - textHeight - (paddingY * 2) - 10;
            const rectW = textWidth + (paddingX * 2);
            const rectH = textHeight + (paddingY * 2);

            // 文字の黒背景
            outputCtx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            outputCtx.fillRect(rectX, rectY, rectW, rectH);
            
            // 白文字描画
            outputCtx.fillStyle = '#ffffff';
            outputCtx.fillText(timestampText, rectX + paddingX, rectY + textHeight + (paddingY / 2));

            prevFrame = currentFrame;
            requestAnimationFrame(processFrame);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', updateFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

        function updateFullscreenBtn() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fullscreenText.textContent = '元に戻す';
                fullscreenIcon.textContent = '🗗';
            } else {
                fullscreenText.textContent = '広げる';
                fullscreenIcon.textContent = '⛶';
            }
        }

        startBtn.addEventListener('click', startCamera);
        recBtnOverlay.addEventListener('click', toggleRecording);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
    </script>
</body>
</html>
