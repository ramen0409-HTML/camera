<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>動体検知システム</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 760px;
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .container:fullscreen {
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            justify-content: center;
            background: #000;
        }
        .container:fullscreen .controls {
            display: none !important;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container:fullscreen .video-wrapper {
            height: 100vh;
            aspect-ratio: auto;
        }
        video {
            display: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .rec-btn-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: rgba(255, 68, 68, 0.9);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            gap: 6px;
        }
        .rec-btn-overlay.recording {
            background: #ff0000;
            animation: pulse-rec 1s infinite;
        }
        @keyframes pulse-rec {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .fullscreen-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background-color: #1e1e1e;
            border-top: 1px solid #2a2a2a;
            flex-wrap: wrap;
        }
        .sound-setting {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        select, input[type="file"] {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }
        .file-upload-wrapper {
            display: none;
            align-items: center;
            gap: 6px;
        }
        .file-upload-wrapper.active {
            display: inline-flex;
        }
        button.action-btn {
            background-color: #00ffcc;
            color: #121212;
            font-weight: bold;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        button.delete-btn {
            background-color: #444;
            color: #ff6666;
            border: 1px solid #666;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            display: none;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: #333;
            color: #aaa;
        }
        .status-badge.active {
            background-color: #00cc88;
            color: #fff;
        }
        .saved-file-info {
            font-size: 0.75rem;
            color: #00ffcc;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="video-wrapper">
            <video id="webcam" playsinline autoplay muted></video>
            <canvas id="outputCanvas" width="640" height="480"></canvas>
            <canvas id="processingCanvas" width="160" height="120" style="display:none;"></canvas>
            
            <button id="recBtnOverlay" class="rec-btn-overlay">
                <span>●</span> <span id="recBtnText">REC 録画開始</span>
            </button>

            <button id="fullscreenBtn" class="fullscreen-btn">
                <span id="fullscreenIcon">⛶</span>
                <span id="fullscreenText">広げる</span>
            </button>
        </div>

        <div class="controls">
            <button id="startBtn" class="action-btn">カメラ起動</button>
            
            <div class="sound-setting">
                <label for="soundSelect" style="font-size:0.85rem; color:#ccc;">効果音:</label>
                <select id="soundSelect">
                    <option value="beep">ピッ (基本音)</option>
                    <option value="pipipi">ピピピッ (通知)</option>
                    <option value="alarm">警報 (サイレン)</option>
                    <option value="custom">カスタム (保存音源)</option>
                </select>

                <div id="fileWrapper" class="file-upload-wrapper">
                    <input type="file" id="audioFile" accept="audio/*">
                    <span id="savedFileName" class="saved-file-info"></span>
                    <button id="deleteSoundBtn" class="delete-btn">削除</button>
                </div>
            </div>

            <span id="status" class="status-badge">停止中</span>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const video = document.getElementById('webcam');
        const outputCanvas = document.getElementById('outputCanvas');
        const outputCtx = outputCanvas.getContext('2d');
        const processingCanvas = document.getElementById('processingCanvas');
        const processingCtx = processingCanvas.getContext('2d', { willReadFrequently: true });
        
        const startBtn = document.getElementById('startBtn');
        const recBtnOverlay = document.getElementById('recBtnOverlay');
        const recBtnText = document.getElementById('recBtnText');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenText = document.getElementById('fullscreenText');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const statusBadge = document.getElementById('status');

        const soundSelect = document.getElementById('soundSelect');
        const fileWrapper = document.getElementById('fileWrapper');
        const audioFileInput = document.getElementById('audioFile');
        const savedFileName = document.getElementById('savedFileName');
        const deleteSoundBtn = document.getElementById('deleteSoundBtn');

        let isRunning = false;
        let prevFrame = null;
        let audioCtx = null;
        let audioDestination = null;
        let lastSoundTime = 0;
        let customAudioBuffer = null;
        const SOUND_COOLDOWN = 300;

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        const threshold = 30;
        const sampleWidth = 160;
        const sampleHeight = 120;

        // --- IndexedDB ---
        const DB_NAME = 'MotionDetectorSoundDB';
        const STORE_NAME = 'sounds';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e);
            });
        }

        async function saveSoundToDB(arrayBuffer, fileName) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ buffer: arrayBuffer, name: fileName }, 'customSound');
            } catch(e) { console.error(e); }
        }

        async function deleteSoundFromDB() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete('customSound');
            } catch(e) { console.error(e); }
        }

        async function loadSoundFromDB() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get('customSound');
                req.onsuccess = async () => {
                    if (req.result) {
                        try {
                            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            const decodedData = await audioCtx.decodeAudioData(req.result.buffer.slice(0));
                            customAudioBuffer = decodedData;
                            savedFileName.textContent = req.result.name;
                            deleteSoundBtn.style.display = 'inline-block';
                        } catch(e) { console.warn(e); }
                    }
                };
            } catch (err) { console.warn(err); }
        }

        loadSoundFromDB();

        soundSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                fileWrapper.classList.add('active');
            } else {
                fileWrapper.classList.remove('active');
            }
        });

        audioFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const arrayBuffer = await file.arrayBuffer();
            await saveSoundToDB(arrayBuffer, file.name);
            savedFileName.textContent = file.name;
            deleteSoundBtn.style.display = 'inline-block';

            audioCtx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
                customAudioBuffer = buffer;
            });
        });

        deleteSoundBtn.addEventListener('click', async () => {
            await deleteSoundFromDB();
            customAudioBuffer = null;
            savedFileName.textContent = '';
            audioFileInput.value = '';
            deleteSoundBtn.style.display = 'none';
            alert('カスタム音源を削除しました。');
        });

        function connectToDestinations(node) {
            if (!audioCtx) return;
            node.connect(audioCtx.destination);
            if (audioDestination) {
                try { node.connect(audioDestination); } catch(e){}
            }
        }

        function playSound() {
            const now = Date.now();
            if (now - lastSoundTime < SOUND_COOLDOWN) return;
            lastSoundTime = now;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const mode = soundSelect.value;

            if (mode === 'beep') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.5, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                connectToDestinations(gain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } 
            else if (mode === 'pipipi') {
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = audioCtx.currentTime + (i * 0.07);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, startTime);
                    gain.gain.setValueAtTime(0.12, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.05);
                    osc.connect(gain);
                    connectToDestinations(gain);
                    osc.start(startTime);
                    osc.stop(startTime + 0.05);
                }
            } 
            else if (mode === 'alarm') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                connectToDestinations(gain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } 
            else if (mode === 'custom' && customAudioBuffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = customAudioBuffer;
                connectToDestinations(source);
                source.start(0);
            }
        }

        async function startCamera() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                let stream = null;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user' },
                        audio: true
                    });
                } catch(e) {
                    // マイク権限で失敗した場合はカメラのみ取得
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                }

                video.srcObject = stream;
                await video.play();

                outputCanvas.width = video.videoWidth || 640;
                outputCanvas.height = video.videoHeight || 480;

                isRunning = true;
                statusBadge.textContent = '監視中';
                statusBadge.classList.add('active');
                startBtn.style.display = 'none';
                recBtnOverlay.style.display = 'inline-flex';

                try {
                    audioDestination = audioCtx.createMediaStreamDestination();
                    const micSource = audioCtx.createMediaStreamSource(stream);
                    micSource.connect(audioDestination);
                } catch(e) { console.warn("マイク取得スキップ", e); }

            } catch (err) {
                alert('カメラの起動に失敗しました。ブラウザのカメラ許可設定を確認してください。');
                console.error(err);
            }
        }

        function getFormattedDateTime() {
            const now = new Date();
            return now.getFullYear() +
                String(now.getMonth() + 1).padStart(2, '0') +
                String(now.getDate()).padStart(2, '0') + '_' +
                String(now.getHours()).padStart(2, '0') +
                String(now.getMinutes()).padStart(2, '0') +
                String(now.getSeconds()).padStart(2, '0');
        }

        function getDisplayText() {
            const now = new Date();
            return now.getFullYear() + '/' +
                String(now.getMonth() + 1).padStart(2, '0') + '/' +
                String(now.getDate()).padStart(2, '0') + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');
        }

        function toggleRecording() {
            if (!isRecording) {
                try {
                    const canvasStream = outputCanvas.captureStream(30);
                    let tracks = [...canvasStream.getVideoTracks()];

                    if (audioDestination && audioDestination.stream.getAudioTracks().length > 0) {
                        tracks.push(audioDestination.stream.getAudioTracks()[0]);
                    }

                    const combinedStream = new MediaStream(tracks);
                    recordedChunks = [];

                    let options = {};
                    if (MediaRecorder.isTypeSupported('video/webm')) {
                        options.mimeType = 'video/webm';
                    } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                        options.mimeType = 'video/mp4';
                    }

                    mediaRecorder = new MediaRecorder(combinedStream, options);

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                    };

                    const startTimestamp = getFormattedDateTime();

                    mediaRecorder.onstop = () => {
                        const mime = mediaRecorder.mimeType || 'video/webm';
                        const ext = mime.includes('mp4') ? 'mp4' : 'webm';
                        const blob = new Blob(recordedChunks, { type: mime });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        a.download = `motion-${startTimestamp}.${ext}`;
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => {
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }, 100);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recBtnText.textContent = '■ 録画停止';
                    recBtnOverlay.classList.add('recording');
                } catch(e) {
                    alert('録画機能の開始に失敗しました。');
                    console.error(e);
                }
            } else {
                if (mediaRecorder) mediaRecorder.stop();
                isRecording = false;
                recBtnText.textContent = 'REC 録画開始';
                recBtnOverlay.classList.remove('recording');
            }
        }

        function processFrame() {
            if (isRunning && video.readyState >= 2) {
                if (outputCanvas.width !== video.videoWidth && video.videoWidth > 0) {
                    outputCanvas.width = video.videoWidth;
                    outputCanvas.height = video.videoHeight;
                }

                outputCtx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);

                processingCtx.drawImage(video, 0, 0, sampleWidth, sampleHeight);
                const currentFrame = processingCtx.getImageData(0, 0, sampleWidth, sampleHeight);

                if (prevFrame) {
                    let minX = sampleWidth, minY = sampleHeight, maxX = 0, maxY = 0;
                    let detectedPixels = 0;
                    const data1 = prevFrame.data;
                    const data2 = currentFrame.data;

                    for (let i = 0; i < data1.length; i += 4) {
                        const diff = (Math.abs(data1[i] - data2[i]) + 
                                      Math.abs(data1[i+1] - data2[i+1]) + 
                                      Math.abs(data1[i+2] - data2[i+2])) / 3;

                        if (diff > threshold) {
                            const pixelIndex = i / 4;
                            const x = pixelIndex % sampleWidth;
                            const y = Math.floor(pixelIndex / sampleWidth);

                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;

                            detectedPixels++;
                        }
                    }

                    if (detectedPixels > 25) {
                        const scaleX = outputCanvas.width / sampleWidth;
                        const scaleY = outputCanvas.height / sampleHeight;

                        outputCtx.strokeStyle = '#00ffcc';
                        outputCtx.lineWidth = 4;
                        outputCtx.strokeRect(minX * scaleX, minY * scaleY, (maxX - minX) * scaleX, (maxY - minY) * scaleY);

                        playSound();
                    }
                }
                prevFrame = currentFrame;
            } else if (!isRunning) {
                outputCtx.fillStyle = '#000000';
                outputCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
            }

            // --- 時間テキスト描画 ---
            const timestampText = getDisplayText();
            outputCtx.font = 'bold 14px monospace';
            const paddingX = 8, paddingY = 6;
            const textWidth = outputCtx.measureText(timestampText).width;
            const textHeight = 14;
            const rectX = 10;
            const rectY = outputCanvas.height - textHeight - (paddingY * 2) - 10;

            outputCtx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            outputCtx.fillRect(rectX, rectY, textWidth + (paddingX * 2), textHeight + (paddingY * 2));
            
            outputCtx.fillStyle = '#ffffff';
            outputCtx.fillText(timestampText, rectX + paddingX, rectY + textHeight + (paddingY / 2));

            requestAnimationFrame(processFrame);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', updateFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

        function updateFullscreenBtn() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fullscreenText.textContent = '元に戻す';
                fullscreenIcon.textContent = '🗗';
            } else {
                fullscreenText.textContent = '広げる';
                fullscreenIcon.textContent = '⛶';
            }
        }

        startBtn.addEventListener('click', startCamera);
        recBtnOverlay.addEventListener('click', toggleRecording);
        fullscreenBtn.addEventListener('click', toggleFullscreen);

        requestAnimationFrame(processFrame);
    </script>
</body>
</html>
