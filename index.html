<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高信頼性 動体検知 ＆ リアルタイム監視システム</title>
    <!-- Tailwind CSS for modern responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern scrollbar and fullscreen overrides */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        
        /* Fullscreen handling */
        .video-container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            background: #000000 !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            background: #000000 !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pulse animation for REC badge */
        @keyframes rec-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.95); }
        }
        .animate-rec {
            animation: rec-pulse 1.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 font-sans select-none antialiased">

    <!-- Main Application Wrapper -->
    <div id="mainWrapper" class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col transition-all duration-300">
        
        <!-- Video Screen Unit (Enlarged Target) -->
        <div id="videoContainer" class="video-container relative w-full aspect-video bg-black overflow-hidden flex items-center justify-center group">
            
            <!-- Hidden Video Element (Source) -->
            <video id="webcam" playsinline autoplay muted class="hidden"></video>
            
            <!-- Main Output Canvas (Live Video + Timestamp + Motion Box) -->
            <canvas id="outputCanvas" class="w-full h-full object-contain bg-black block"></canvas>
            
            <!-- Offscreen Canvas for downscaled motion processing (Hidden) -->
            <canvas id="processingCanvas" width="160" height="120" class="hidden"></canvas>

            <!-- Camera Idle Standby Overlay -->
            <div id="standbyOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20 transition-opacity duration-300">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-slate-800/80 rounded-full flex items-center justify-center mb-4 border border-slate-700 shadow-inner">
                    <svg class="w-8 h-8 sm:w-10 sm:h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h2 class="text-lg sm:text-xl font-bold text-slate-100 mb-2">カメラが停止しています</h2>
                <p class="text-xs sm:text-sm text-slate-400 max-w-md mb-6 leading-relaxed">
                    下部の「カメラ起動」ボタンを押してください。<br class="hidden sm:inline">スマホ・PCのカメラアクセス許可メッセージが表示された場合は「許可」を選択してください。
                </p>
                <button id="overlayStartBtn" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-bold text-sm rounded-xl shadow-lg shadow-emerald-950/50 flex items-center gap-2 transition transform active:scale-95">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    <span>今すぐカメラを起動する</span>
                </button>
            </div>

            <!-- Top Left: Live REC Toggle Overlay Button -->
            <button id="recBtnOverlay" class="absolute top-3 left-3 z-30 hidden items-center gap-2 px-3.5 py-1.5 rounded-lg bg-slate-900/80 hover:bg-slate-800 text-white text-xs font-bold border border-slate-700/80 backdrop-blur-md shadow-md transition-all active:scale-95">
                <span id="recDot" class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                <span id="recBtnText">REC 録画開始</span>
            </button>

            <!-- Bottom Right: Fullscreen / Expand Overlay Button -->
            <button id="fullscreenBtn" class="absolute bottom-3 right-3 z-30 flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900/80 hover:bg-slate-800 text-slate-200 text-xs font-semibold border border-slate-700/80 backdrop-blur-md shadow-md transition-all active:scale-95">
                <svg id="fullscreenIcon" class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                </svg>
                <span id="fullscreenText">広げる</span>
            </button>
        </div>

        <!-- Controls & Sound Settings Panel (Auto-hidden in Fullscreen mode) -->
        <div id="controlsPanel" class="p-4 sm:p-5 bg-slate-900 border-t border-slate-800 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
            
            <!-- Left Side: Camera Activation & Status -->
            <div class="flex items-center justify-between sm:justify-start gap-3">
                <button id="startBtn" class="flex-1 sm:flex-initial px-5 py-2.5 bg-cyan-500 hover:bg-cyan-400 active:bg-cyan-600 text-slate-950 font-bold text-sm rounded-xl shadow-md transition transform active:scale-95 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span>カメラ起動</span>
                </button>

                <div id="statusBadge" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-400 flex items-center gap-2">
                    <span id="statusIndicator" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="statusText">停止中</span>
                </div>
            </div>

            <!-- Right Side: Sound Alert Configuration -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-3 bg-slate-950/60 p-2 sm:p-2.5 rounded-xl border border-slate-800/80">
                <label for="soundSelect" class="text-xs font-semibold text-slate-400 pl-1">アラート音:</label>
                <select id="soundSelect" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg text-xs px-2.5 py-1.5 focus:outline-none focus:border-cyan-500 transition">
                    <option value="beep">ピッ (基本音)</option>
                    <option value="pipipi">ピピピッ (通知)</option>
                    <option value="alarm">警報サイレン</option>
                    <option value="custom">カスタム音源 (保存可能)</option>
                </select>

                <!-- Custom Sound File Uploader & Delete Button -->
                <div id="fileWrapper" class="hidden items-center gap-2">
                    <label for="audioFile" class="cursor-pointer bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg transition">
                        ファイル選択
                    </label>
                    <input type="file" id="audioFile" accept="audio/*" class="hidden">
                    
                    <span id="savedFileName" class="text-xs text-cyan-400 max-w-[100px] truncate font-mono"></span>
                    
                    <button id="deleteSoundBtn" class="hidden px-2 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs rounded-md font-semibold transition">
                        削除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements Initialization
        const mainWrapper = document.getElementById('mainWrapper');
        const videoContainer = document.getElementById('videoContainer');
        const controlsPanel = document.getElementById('controlsPanel');
        const video = document.getElementById('webcam');
        const outputCanvas = document.getElementById('outputCanvas');
        const outputCtx = outputCanvas.getContext('2d');
        const processingCanvas = document.getElementById('processingCanvas');
        const processingCtx = processingCanvas.getContext('2d', { willReadFrequently: true });

        const standbyOverlay = document.getElementById('standbyOverlay');
        const overlayStartBtn = document.getElementById('overlayStartBtn');
        const startBtn = document.getElementById('startBtn');
        const statusBadge = document.getElementById('statusBadge');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');

        const recBtnOverlay = document.getElementById('recBtnOverlay');
        const recDot = document.getElementById('recDot');
        const recBtnText = document.getElementById('recBtnText');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fullscreenIcon = document.getElementById('fullscreenIcon');
        const fullscreenText = document.getElementById('fullscreenText');

        const soundSelect = document.getElementById('soundSelect');
        const fileWrapper = document.getElementById('fileWrapper');
        const audioFileInput = document.getElementById('audioFile');
        const savedFileName = document.getElementById('savedFileName');
        const deleteSoundBtn = document.getElementById('deleteSoundBtn');

        // State Flags
        let isRunning = false;
        let prevFrame = null;
        let audioCtx = null;
        let audioDestination = null;
        let lastSoundTime = 0;
        let customAudioBuffer = null;
        const SOUND_COOLDOWN = 350; // ms

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        const motionThreshold = 28;
        const sampleWidth = 160;
        const sampleHeight = 120;

        // --- IndexedDB for Custom Sound Persistence ---
        const DB_NAME = 'MotionDetectorSoundDB_v2';
        const STORE_NAME = 'sounds';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e);
            });
        }

        async function saveSoundToDB(arrayBuffer, fileName) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put({ buffer: arrayBuffer, name: fileName }, 'customSound');
            } catch (err) {
                console.error('IndexedDB Save Error:', err);
            }
        }

        async function deleteSoundFromDB() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete('customSound');
            } catch (err) {
                console.error('IndexedDB Delete Error:', err);
            }
        }

        async function loadSoundFromDB() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get('customSound');
                req.onsuccess = async () => {
                    if (req.result) {
                        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const decodedData = await audioCtx.decodeAudioData(req.result.buffer.slice(0));
                        customAudioBuffer = decodedData;
                        savedFileName.textContent = req.result.name;
                        deleteSoundBtn.classList.remove('hidden');
                    }
                };
            } catch (err) {
                console.warn('Failed to load custom sound from IndexedDB:', err);
            }
        }

        loadSoundFromDB();

        // UI Event Listeners for Sound Select
        soundSelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                fileWrapper.classList.remove('hidden');
                fileWrapper.classList.add('flex');
            } else {
                fileWrapper.classList.add('hidden');
                fileWrapper.classList.remove('flex');
            }
        });

        audioFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            try {
                const arrayBuffer = await file.arrayBuffer();
                await saveSoundToDB(arrayBuffer, file.name);
                savedFileName.textContent = file.name;
                deleteSoundBtn.classList.remove('hidden');

                audioCtx.decodeAudioData(arrayBuffer.slice(0), (buffer) => {
                    customAudioBuffer = buffer;
                });
            } catch (err) {
                alert('音声ファイルの読み込みに失敗しました。別の形式を試してください。');
            }
        });

        deleteSoundBtn.addEventListener('click', async () => {
            await deleteSoundFromDB();
            customAudioBuffer = null;
            savedFileName.textContent = '';
            audioFileInput.value = '';
            deleteSoundBtn.classList.add('hidden');
        });

        function connectToDestinations(node) {
            node.connect(audioCtx.destination);
            if (audioDestination) {
                node.connect(audioDestination);
            }
        }

        function playSound() {
            const now = Date.now();
            if (now - lastSoundTime < SOUND_COOLDOWN) return;
            lastSoundTime = now;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const mode = soundSelect.value;

            if (mode === 'beep') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.5, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                connectToDestinations(gain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } 
            else if (mode === 'pipipi') {
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const startTime = audioCtx.currentTime + (i * 0.07);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, startTime);
                    gain.gain.setValueAtTime(0.15, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.05);
                    osc.connect(gain);
                    connectToDestinations(gain);
                    osc.start(startTime);
                    osc.stop(startTime + 0.05);
                }
            } 
            else if (mode === 'alarm') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                connectToDestinations(gain);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } 
            else if (mode === 'custom' && customAudioBuffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = customAudioBuffer;
                connectToDestinations(source);
                source.start(0);
            }
        }

        async function startCamera() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();

            let stream = null;

            // Step 1: Ideal constraints attempt
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
                    audio: true
                });
            } catch (err1) {
                console.warn('Ideal camera constraints failed, attempting basic fallback:', err1);
                // Step 2: Fallback attempt without rigid constraints
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });
                } catch (err2) {
                    // Step 3: Fallback without audio if audio permission was rejected
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    } catch (err3) {
                        alert('カメラにアクセスできませんでした。\nブラウザのURL横の鍵マークからカメラへのアクセス許可を「ON」にして再読み込みしてください。');
                        console.error('Final camera access error:', err3);
                        return;
                    }
                }
            }

            video.srcObject = stream;

            // Wait until video metadata and actual playback dimension are ready
            await new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play().then(resolve).catch(resolve);
                };
            });

            // Adjust Canvas Dimensions dynamically
            outputCanvas.width = video.videoWidth || 640;
            outputCanvas.height = video.videoHeight || 480;

            // Setup audio destination stream for WebM recorder
            audioDestination = audioCtx.createMediaStreamDestination();
            try {
                if (stream.getAudioTracks().length > 0) {
                    const micSource = audioCtx.createMediaStreamSource(stream);
                    micSource.connect(audioDestination);
                }
            } catch (e) {
                console.warn('Audio tracking setup failed:', e);
            }

            isRunning = true;

            // UI updates
            standbyOverlay.classList.add('opacity-0', 'pointer-events-none');
            recBtnOverlay.classList.remove('hidden');
            recBtnOverlay.classList.add('flex');

            statusIndicator.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
            statusText.textContent = '監視中';
            statusText.className = 'text-emerald-400 font-bold';
            
            startBtn.classList.add('hidden');
        }

        // Formatting timestamp for filename & display
        function getFormattedDateTime() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mi = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            return `${yyyy}${mm}${dd}_${hh}${mi}${ss}`;
        }

        function getDisplayText() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mi = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            return `${yyyy}/${mm}/${dd} ${hh}:${mi}:${ss}`;
        }

        function toggleRecording() {
            if (!isRecording) {
                const canvasStream = outputCanvas.captureStream(30);
                const combinedTracks = [...canvasStream.getVideoTracks()];

                if (audioDestination && audioDestination.stream.getAudioTracks().length > 0) {
                    combinedTracks.push(...audioDestination.stream.getAudioTracks());
                }

                const combinedStream = new MediaStream(combinedTracks);
                recordedChunks = [];

                let options = { mimeType: 'video/webm' };
                if (!MediaRecorder.isTypeSupported('video/webm')) {
                    options = { mimeType: 'video/mp4' };
                }

                try {
                    mediaRecorder = new MediaRecorder(combinedStream, options);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(combinedStream);
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                };

                const startTimestamp = getFormattedDateTime();

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `motion-${startTimestamp}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                };

                mediaRecorder.start(1000);
                isRecording = true;
                recBtnText.textContent = '■ 録画停止';
                recDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 animate-rec';
                recBtnOverlay.classList.add('border-rose-500/80', 'bg-rose-950/80');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recBtnText.textContent = 'REC 録画開始';
                recDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
                recBtnOverlay.classList.remove('border-rose-500/80', 'bg-rose-950/80');
            }
        }

        function processFrame() {
            // Check if live camera stream is ready
            if (isRunning && video.readyState >= 2 && video.videoWidth > 0) {
                
                // Synchronize output canvas aspect with stream
                if (outputCanvas.width !== video.videoWidth || outputCanvas.height !== video.videoHeight) {
                    outputCanvas.width = video.videoWidth;
                    outputCanvas.height = video.videoHeight;
                }

                // Render current camera frame
                outputCtx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);

                // Downscale & process motion on offscreen canvas
                processingCtx.drawImage(video, 0, 0, sampleWidth, sampleHeight);
                const currentFrame = processingCtx.getImageData(0, 0, sampleWidth, sampleHeight);

                if (prevFrame) {
                    let minX = sampleWidth;
                    let minY = sampleHeight;
                    let maxX = 0;
                    let maxY = 0;
                    let detectedPixels = 0;

                    const d1 = prevFrame.data;
                    const d2 = currentFrame.data;

                    for (let i = 0; i < d1.length; i += 4) {
                        const diff = (Math.abs(d1[i] - d2[i]) + 
                                      Math.abs(d1[i+1] - d2[i+1]) + 
                                      Math.abs(d1[i+2] - d2[i+2])) / 3;

                        if (diff > motionThreshold) {
                            const pixelIdx = i / 4;
                            const x = pixelIdx % sampleWidth;
                            const y = Math.floor(pixelIdx / sampleWidth);

                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;

                            detectedPixels++;
                        }
                    }

                    // Motion threshold trigger
                    if (detectedPixels > 20) {
                        const scaleX = outputCanvas.width / sampleWidth;
                        const scaleY = outputCanvas.height / sampleHeight;

                        const rectX = minX * scaleX;
                        const rectY = minY * scaleY;
                        const rectW = Math.max((maxX - minX) * scaleX, 20);
                        const rectH = Math.max((maxY - minY) * scaleY, 20);

                        // Draw bounding box on active canvas
                        outputCtx.strokeStyle = '#00ffcc';
                        outputCtx.lineWidth = Math.max(3, Math.round(outputCanvas.width / 200));
                        outputCtx.strokeRect(rectX, rectY, rectW, rectH);

                        playSound();
                    }
                }
                prevFrame = currentFrame;

            } else {
                // Standby / Fallback black screen canvas fill
                if (outputCanvas.width === 0) outputCanvas.width = 640;
                if (outputCanvas.height === 0) outputCanvas.height = 480;

                outputCtx.fillStyle = '#0f172a';
                outputCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
            }

            const timestampText = getDisplayText();
            const fontSize = Math.max(12, Math.round(outputCanvas.height / 32));
            outputCtx.font = `bold ${fontSize}px monospace`;

            const paddingX = fontSize * 0.6;
            const paddingY = fontSize * 0.4;
            const textWidth = outputCtx.measureText(timestampText).width;

            const boxMargin = fontSize * 0.8;
            const rectX = boxMargin;
            const rectY = outputCanvas.height - fontSize - (paddingY * 2) - boxMargin;
            const rectW = textWidth + (paddingX * 2);
            const rectH = fontSize + (paddingY * 2);

            // Dark semi-transparent box background
            outputCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            outputCtx.fillRect(rectX, rectY, rectW, rectH);

            // White text
            outputCtx.fillStyle = '#ffffff';
            outputCtx.fillText(timestampText, rectX + paddingX, rectY + fontSize + (paddingY / 4));

            requestAnimationFrame(processFrame);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (videoContainer.requestFullscreen) {
                    videoContainer.requestFullscreen();
                } else if (videoContainer.webkitRequestFullscreen) {
                    videoContainer.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
